[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capture-core"
version = "0.1.0"
description = "Capture core plus the local HTTP capture surface for the multimodal capture and ingestion layer."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # The document processor's PDF reader. Focused on reading and writing PDF
    # structure, pure Python, no system libraries, and no subprocess — which is
    # why it is `core`'s first non-pydantic runtime dependency and why that was
    # an acceptable thing to add. PyMuPDF, pdfplumber, poppler, and anything
    # with an OCR engine behind it are deliberately absent.
    "pypdf>=5.0",
    # The document processor's DOCX reader, and the only new runtime dependency
    # Phase 3 PR 2 adds. Chosen for its *public* body-order API —
    # `Document.iter_inner_content()` yields paragraphs and tables in document
    # order — so this build never has to reach into the OOXML tree itself to
    # learn where a table sat relative to the paragraphs around it; 1.2 is the
    # floor because that method is what makes the ordering guarantee expressible
    # without private XML access. It is pure Python plus lxml, needs no system
    # word processor, and runs no subprocess. mammoth, docx2txt, pandoc,
    # LibreOffice, and Word automation are deliberately absent: the first two
    # convert to other formats this build does not want, and the rest are
    # renderers, which is how fictional page numbers get invented.
    "python-docx>=1.2",
    # Required by FastAPI to parse a `multipart/form-data` body, which is how
    # `POST /v1/uploads` receives bytes. FastAPI declares `UploadFile` and this
    # is the parser behind it; it is not a UniMem design choice beyond choosing
    # multipart over a raw body.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # Starlette's TestClient runs the ASGI app in-process over an HTTP client
    # library; it is the only way to exercise the real HTTP stack without
    # binding a TCP port. Current Starlette wants httpx2 and deprecates httpx.
    "httpx2>=2.12",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/unimem_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-W", "error",
    # Warnings stay fatal; this one exception is a deprecation Starlette raises
    # against itself. `starlette.testclient` imports the
    # `anyio.abc.BlockingPortal` alias at module level, which anyio now
    # deprecates, so it fires while conftest is being imported and there is
    # nothing in this repository to fix. It is listed here rather than under
    # `filterwarnings` because an ini filter is not yet in force that early.
    # The pattern is as narrow as the message allows, so any other deprecation
    # — including a different one from anyio — is still an error.
    "-W", "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["core", "unimem_api"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific
]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

# `lxml` ships no type information and publishes no stubs of its own. It is not
# a dependency this project chose — `python-docx` brings it, and it is never
# imported anywhere but `core.processing.docx`, and there for exactly one name:
# the parser error raised by a DOCX whose XML does not parse, which this build
# translates into a `ProcessingInputError`. Narrowed to that package so every
# other import stays under `strict`.
[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
