[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capture-core"
version = "0.1.0"
description = "Capture core plus the local HTTP capture surface for the multimodal capture and ingestion layer."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # The document processor's PDF reader. Focused on reading and writing PDF
    # structure, pure Python, no system libraries, and no subprocess — which is
    # why it is `core`'s first non-pydantic runtime dependency and why that was
    # an acceptable thing to add. PyMuPDF, pdfplumber, poppler, and anything
    # with an OCR engine behind it are deliberately absent.
    "pypdf>=5.0",
    # The document processor's DOCX reader, and the only new runtime dependency
    # Phase 3 PR 2 adds. Chosen for its *public* body-order API —
    # `Document.iter_inner_content()` yields paragraphs and tables in document
    # order — so this build never has to reach into the OOXML tree itself to
    # learn where a table sat relative to the paragraphs around it; 1.2 is the
    # floor because that method is what makes the ordering guarantee expressible
    # without private XML access. It is pure Python plus lxml, needs no system
    # word processor, and runs no subprocess. mammoth, docx2txt, pandoc,
    # LibreOffice, and Word automation are deliberately absent: the first two
    # convert to other formats this build does not want, and the rest are
    # renderers, which is how fictional page numbers get invented.
    "python-docx>=1.2",
    # Required by FastAPI to parse a `multipart/form-data` body, which is how
    # `POST /v1/uploads` receives bytes. FastAPI declares `UploadFile` and this
    # is the parser behind it; it is not a UniMem design choice beyond choosing
    # multipart over a raw body.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# The optional local-OCR capability, and deliberately *optional*. A default
# deployment installs neither of these, imports neither of them, and refuses
# textless PDFs exactly as it always did; `pip install "capture-core[ocr]"` is
# what makes `python -m unimem_api --pdf-ocr` possible. Both are native wheels,
# which is most of the reason they are not unconditional: a build that cannot
# start without a PDF renderer and an imaging library is a build whose kernel
# has acquired two system dependencies it does not need.
#
# Tesseract itself is NOT here and cannot be. It is a system executable with its
# own language data files, installed by the machine's package manager; see the
# README. Nothing in this project installs, downloads, or vendors it.
ocr = [
    # The page rasterizer. Chosen for being a thin, well-documented ctypes
    # binding over PDFium — the renderer Chromium uses — with no imaging stack
    # of its own and no subprocess. The 5.x floor is the API this adapter is
    # written against: `PdfDocument(stream, autoclose=False)`,
    # `PdfPage.render(scale=..., draw_annots=..., may_draw_forms=...,
    # fill_color=...)`, `PdfBitmap.to_pil()`, and the `version.PYPDFIUM_INFO` /
    # `version.PDFIUM_INFO` pair whose names 4.x did not have. Tested against
    # 5.13.0 (pdfium 153.0.7999.0). PyMuPDF is absent because its licence is
    # AGPL; poppler and Ghostscript because they are system installations with
    # their own CLIs; pdf2image because it is a wrapper around one of those.
    "pypdfium2>=5.0",
    # Encodes a rendered page as the PNG the engine reads, and nothing else. The
    # 11.0 floor is a supported-release choice rather than an API one — the two
    # calls used, `PdfBitmap.to_pil()`'s `Image.frombuffer` result and
    # `Image.save(..., format="PNG")`, have been stable for far longer. Tested
    # against 12.3.0.
    "Pillow>=11.0",
]
dev = [
    "pytest>=8.3",
    # Starlette's TestClient runs the ASGI app in-process over an HTTP client
    # library; it is the only way to exercise the real HTTP stack without
    # binding a TCP port. Current Starlette wants httpx2 and deprecates httpx.
    "httpx2>=2.12",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
# `unimem_ocr` ships in the wheel unconditionally, which is not a contradiction
# of the optional extra above: the package is a few hundred lines of pure Python
# that imports its native dependencies lazily, so installing it costs nothing and
# leaving it out would mean `--pdf-ocr` failed with "no such module" on a machine
# that had installed the extra.
packages = ["src/core", "src/unimem_api", "src/unimem_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-W", "error",
    # Warnings stay fatal; this one exception is a deprecation Starlette raises
    # against itself. `starlette.testclient` imports the
    # `anyio.abc.BlockingPortal` alias at module level, which anyio now
    # deprecates, so it fires while conftest is being imported and there is
    # nothing in this repository to fix. It is listed here rather than under
    # `filterwarnings` because an ini filter is not yet in force that early.
    # The pattern is as narrow as the message allows, so any other deprecation
    # — including a different one from anyio — is still an error.
    "-W", "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["core", "unimem_api"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific
]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

# `lxml` ships no type information and publishes no stubs of its own. It is not
# a dependency this project chose — `python-docx` brings it, and it is never
# imported anywhere but `core.processing.docx`, and there for exactly one name:
# the parser error raised by a DOCX whose XML does not parse, which this build
# translates into a `ProcessingInputError`. Narrowed to that package so every
# other import stays under `strict`.
[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true

# `pypdfium2` ships no `py.typed` marker and publishes no stubs, and none exist
# on typeshed. It is imported in exactly two places, both inside the optional
# adapter package: `unimem_ocr.tesseract` (the renderer itself) and
# `unimem_ocr.prerequisites` (the two version constants, for the line an operator
# reads). Narrowed to that one distribution so every other import — including
# Pillow, which does ship types — stays under `strict`, and so that nothing in
# `core` or `unimem_api` can acquire an untyped import by accident.
[[tool.mypy.overrides]]
module = ["pypdfium2.*"]
ignore_missing_imports = true

# `Pillow` *does* ship type information, and where it is installed mypy uses it
# normally — this row only stops mypy failing where the optional `ocr` extra is
# absent, which is the state the quality-gates job deliberately runs in: the
# baseline gates must pass on an ordinary installation, and an ordinary
# installation has no imaging library. Narrowed to the one distribution, so
# nothing else can lose its types this way. The alternative was installing the
# extra everywhere, which would have made "the default build needs no rasterizer"
# untestable in the job that checks it.
[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
