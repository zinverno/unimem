name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy

      - name: pytest
        # Both packages, so the delivery surface is measured too and the
        # coverage floor applies to it rather than only to the kernel.
        run: pytest --cov=core --cov=unimem_api

  browser-connector:
    name: Browser connector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The connector has no dependencies at all — no bundler, no test
      # framework, nothing to install — so this step exists only to pin the
      # runtime that `node --test` comes from.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: node --test
        run: npm test --prefix clients/browser-extension

  browser-api-integration:
    # The two jobs above each prove one side. This one proves they meet, for
    # both things the extension can capture.
    #
    #   selection, and a lost response:
    #     real connector JS
    #       -> first POST reaches real uvicorn on a real socket
    #       -> that response is thrown away after the server processed it
    #       -> the same envelope, same id, is POSTed once more
    #       -> the server answers 200 replay
    #       -> the connector reports complete, confirmed by replay
    #       -> one CaptureRecord, one ContentObject, one raw original
    #
    #   whole page:
    #     real connector whole-page flow, builder, and client
    #       -> a representative outerHTML snapshot (the only fake: there is no
    #          browser here, so the page read is stubbed)
    #       -> POST reaches the same real server
    #       -> 201, OK, a durable web ContentObject whose original is the exact
    #          submitted bytes
    #     ...and the same flow with the first reply lost:
    #       -> retry is answered 409, because webpage replay is intentionally
    #          absent
    #       -> one observational GET sees COMPLETE
    #       -> confirmed success, two POSTs and one GET, one of everything
    #
    # It needs both runtimes, which is why it is its own job rather than a step
    # in either of the others: the Python job must not grow a Node dependency,
    # and the connector job must not grow a Python one.
    name: Browser/API cross-language integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Cross-language acceptance tests
        env:
          # Without this the tests skip when node is missing or the connector's
          # port is taken, and a green run would prove nothing. With it, every
          # such reason is a failure instead — for the whole-page classes as
          # much as for the selection one.
          UNIMEM_REQUIRE_CONNECTOR_INTEGRATION: "1"
        run: |
          pytest \
            "tests/integration/api/test_completed_capture_replay.py::TestThroughTheConnectorItself" \
            "tests/integration/api/test_browser_whole_page_capture.py::TestWholePageThroughTheConnector" \
            "tests/integration/api/test_browser_whole_page_capture.py::TestTheWholePageLostResponse" \
            -v -rs --junitxml=connector-integration.xml

      - name: Prove they actually ran
        # Belt and braces. The required mode turns every in-test skip into a
        # failure, so this can only fire if a class is renamed, deselected, or
        # skipped by something outside that policy — each of which would
        # otherwise leave a passing job that tested nothing at all.
        #
        # Each class is counted separately, and the selection guarantee keeps its
        # own floor: adding whole-page coverage must not be a way to quietly ship
        # fewer selection assertions.
        if: always()
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          #: class name -> the number of tests it must contribute, at least.
          REQUIRED = {
              "TestThroughTheConnectorItself": 8,
              "TestWholePageThroughTheConnector": 1,
              "TestTheWholePageLostResponse": 1,
          }

          suite = ET.parse("connector-integration.xml").getroot()
          totals = suite.find("testsuite") if suite.tag == "testsuites" else suite
          if totals is None:
              sys.exit("no test suite was recorded")

          ran = int(totals.get("tests", "0"))
          skipped = int(totals.get("skipped", "0"))
          print(f"tests={ran} skipped={skipped}")

          if ran == 0:
              sys.exit("the cross-language acceptance tests did not run at all")
          if skipped:
              sys.exit(f"{skipped} of {ran} cross-language acceptance tests were skipped")

          counted = {}
          for case in totals.iter("testcase"):
              name = (case.get("classname") or "").rsplit(".", 1)[-1]
              counted[name] = counted.get(name, 0) + 1

          for name, floor in REQUIRED.items():
              found = counted.get(name, 0)
              print(f"{name}={found} (required >= {floor})")
              if found < floor:
                  sys.exit(f"{name} contributed {found} tests; at least {floor} were required")
          PY

  pdf-ocr:
    # The three jobs above run on an ordinary installation and must keep doing
    # so: nothing they exercise needs a rasterizer, an imaging library, or an OCR
    # engine, and that is the property that makes local OCR *optional*. This job
    # is the other half — the only one that installs the `ocr` extra and a system
    # Tesseract, and the only one where the native recognition tests are allowed
    # to run at all.
    #
    # It proves the thing a fake engine cannot:
    #
    #   an image-only PDF with no text layer
    #     -> real PDFium rasterizes the page at 300 DPI
    #     -> real Tesseract reads it, in English and in Russian
    #     -> POST /v1/uploads + POST /v1/captures against a real server process
    #        on a real socket
    #     -> a DOCUMENT ContentObject whose segments are `ocr` with `ocr`
    #        provenance and the right physical page numbers
    #     -> the process is stopped and restarted over the same data directory
    #        and everything reads back identically
    #
    # ...and the refusals: a blank scan does not become an empty COMPLETE
    # document, and an engine that fails mid-run leaves the capture non-terminal
    # behind a safe 503.
    name: Local PDF OCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Tesseract with English and Russian language data
        # System prerequisites, installed by the machine's package manager. This
        # project never installs, downloads, or vendors any of them — which is
        # exactly why they have to be named here. `fonts-dejavu-core` is for the
        # *tests*: the image-only fixtures are rendered locally from a system
        # font, because no font file and no binary fixture is committed to this
        # repository and nothing is fetched at test time.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus fonts-dejavu-core

      - name: Install package with dev and ocr extras
        run: python -m pip install -e ".[dev,ocr]"

      - name: Print what is actually going to run
        # Through the project's own probes rather than a separate shell command,
        # so this log line is evidence about the code path the adapter takes.
        run: |
          tesseract --version
          tesseract --list-langs
          python -c "from unimem_ocr import describe_prerequisites; print(describe_prerequisites())"

      - name: Whole suite, with the native OCR tests required
        env:
          # Without this the native tests skip when the engine, a language pack,
          # a font, or the extra is missing, and a green run would prove nothing.
          # With it, every one of those reasons is a failure instead.
          UNIMEM_REQUIRE_PDF_OCR_INTEGRATION: "1"
        # `unimem_ocr` is measured alongside the two packages the quality-gates
        # job measures: the adapter is where the subprocess, the native handles,
        # and the resource limits live, and an unmeasured adapter is where an
        # untested error path hides.
        run: |
          pytest \
            --cov=core --cov=unimem_api --cov=unimem_ocr \
            -rs --junitxml=pdf-ocr.xml

      - name: Prove the native tests actually ran
        # Belt and braces, exactly as for the browser/API job. The required mode
        # turns every in-test skip into a failure, so this can only fire if a
        # class is renamed, deselected, or skipped by something outside that
        # policy — each of which would otherwise leave a passing job that never
        # touched the engine.
        #
        # Each acceptance group is counted separately and by its *full* name.
        # Counting by bare class name would let two different modules' identically
        # named classes cover for each other.
        if: always()
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          #: Fully-qualified class -> the number of tests it must contribute, at least.
          REQUIRED = {
              "tests.integration.ocr.test_real_pdf_ocr.TestTheFixturesCarryNoTextLayer": 6,
              "tests.integration.ocr.test_real_pdf_ocr.TestTheEngineReallyReads": 5,
              "tests.integration.ocr.test_real_pdf_ocr.TestTheProcessorOverTheRealEngine": 10,
              "tests.integration.ocr.test_real_pdf_ocr.TestDocumentsTheRealStackRefuses": 6,
              "tests.integration.ocr.test_real_pdf_ocr_http.TestAScanOverRealHttp": 14,
              "tests.integration.ocr.test_real_pdf_ocr_http.TestARestartOfTheServerProcess": 5,
              "tests.integration.ocr.test_real_pdf_ocr_http.TestARuntimeEngineFailureOverHttp": 6,
              "tests.integration.ocr.test_real_pdf_ocr_http.TestStartupRefusalIsNotASkip": 1,
              "tests.unit.ocr.test_pdf_freeze.TestThePdfCommandLineIsFrozen": 4,
              "tests.unit.ocr.test_pdf_freeze.TestThePdfErrorMessagesAreFrozen": 5,
              "tests.unit.ocr.test_pdf_freeze.TestThePdfFailureTypeIsFrozen": 5,
              "tests.unit.ocr.test_tesseract_adapter.TestTheCommandLine": 6,
              "tests.unit.ocr.test_tesseract_adapter.TestResourceLimits": 7,
              "tests.unit.ocr.test_tesseract_adapter.TestTheRecognitionBudget": 6,
              "tests.unit.ocr.test_tesseract_adapter.TestABudgetSpentWaitingForTheNativeLock": 3,
              "tests.unit.ocr.test_tesseract_adapter.TestATimingOutEngine": 3,
              "tests.unit.ocr.test_tesseract_adapter.TestTheNativeLibraryLock": 6,
              "tests.unit.ocr.test_tesseract_adapter.TestRasterLifetime": 10,
              "tests.unit.ocr.test_tesseract_adapter.TestLoadErrorClassification": 46,
              "tests.unit.ocr.test_prerequisites.TestBothLanguagesAreRequired": 9,
              "tests.unit.ocr.test_prerequisites_native.TestPillowMustBeProvenNotAssumed": 4,
              "tests.unit.ocr.test_prerequisites_native.TestTheProductionEntryPointRefusesToStart": 2,
              "tests.integration.ocr.test_pdf_ocr_load_failures.TestAnUnprovenLoadFailureIsNonTerminal": 18,
              "tests.integration.ocr.test_pdf_ocr_load_failures.TestARecognizedFormatFailureStaysAnInputVerdict": 7,
          }

          #: Everything under these prefixes is the required suite.
          OCR_PREFIXES = ("tests.unit.ocr.", "tests.integration.ocr.")

          suite = ET.parse("pdf-ocr.xml").getroot()
          totals = suite.find("testsuite") if suite.tag == "testsuites" else suite
          if totals is None:
              sys.exit("no test suite was recorded")

          ran = int(totals.get("tests", "0"))
          errors = int(totals.get("errors", "0"))
          print(f"tests={ran} errors={errors}")
          if ran == 0:
              sys.exit("the suite did not run at all")
          if errors:
              sys.exit(f"{errors} collection or setup errors were recorded")

          counted = {}
          skipped = []
          for case in totals.iter("testcase"):
              name = case.get("classname") or ""
              if not name.startswith(OCR_PREFIXES):
                  continue
              counted[name] = counted.get(name, 0) + 1
              if case.find("skipped") is not None:
                  skipped.append(f"{name}::{case.get('name')}")

          native = sum(counted.values())
          print(f"native OCR tests={native} skipped={len(skipped)}")
          if native == 0:
              sys.exit("no native PDF OCR test ran; the engine was never exercised")
          if skipped:
              sys.exit("required PDF OCR tests were skipped: " + ", ".join(skipped))

          for name, floor in REQUIRED.items():
              found = counted.get(name, 0)
              print(f"{name}={found} (required >= {floor})")
              if found < floor:
                  sys.exit(f"{name} contributed {found} tests; at least {floor} were required")
          PY

  image-ocr:
    # The fifth job, and the only one that proves a *dependency boundary* rather
    # than a behaviour. It exists because every claim that `--image-ocr` needs
    # neither PDFium nor Pillow is, until something checks it, a comment: the
    # `pdf-ocr` job installs the `ocr` extra before it runs anything, so both
    # packages are importable for its whole life and a stray module-level import
    # in the image path would go unnoticed there forever.
    #
    # So this job installs the ordinary package and the dev dependencies and
    # *stops*. No extra. Then it proves, in order:
    #
    #   pypdfium2 is not importable        -- so step 3 is evidence, not luck
    #   Pillow is not importable
    #   real Tesseract reads a real PNG    -- through TesseractImageOcr itself
    #   ...and over real HTTP              -- `python -m unimem_api --image-ocr`
    #   the required tests actually ran    -- a skip cannot make this green
    #
    # A separate job rather than a step inside `pdf-ocr`, because the two need
    # incompatible installations: one is defined by having the extra and the
    # other by not having it. The existing `Local PDF OCR` job is untouched.
    name: Local image OCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Tesseract with English and Russian language data
        # The whole of this capability's prerequisites. No `fonts-dejavu-core`
        # here, unlike the PDF job: the image fixture is drawn byte by byte from
        # `zlib` rather than rendered from a system font, precisely so that this
        # job needs nothing an image OCR deployment would not need.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus

      - name: Install the package with dev dependencies ONLY
        # Deliberately not ".[dev,ocr]". The absence is the thing under test.
        run: python -m pip install -e ".[dev]"

      - name: Prove the optional extra is genuinely absent
        # GitHub's runner images carry unrelated preinstalled packages, and a
        # future one could ship Pillow. Uninstalling first makes the proof robust
        # against that rather than against today's image only, and `importlib` is
        # asked directly so a stale entry in a parent environment cannot answer
        # for the interpreter that will run the tests.
        run: |
          python -m pip uninstall -y pypdfium2 Pillow || true
          python - <<'PY'
          import importlib.util
          import sys

          for name in ("pypdfium2", "PIL"):
              if importlib.util.find_spec(name) is not None:
                  sys.exit(f"{name} is importable; this job must run without it")
          print("neither pypdfium2 nor Pillow is importable")
          PY

      - name: Print what is actually going to run
        run: |
          tesseract --version
          tesseract --list-langs

      - name: Real image OCR, with the extra absent and skips forbidden
        env:
          # Without this the native tests skip when the engine or a language pack
          # is missing, and a green run would prove nothing. With it, every one of
          # those reasons is a failure instead. Note that the *PDF* required flag
          # is deliberately NOT set: those suites need the extra this job does not
          # have, and they skip here on purpose.
          UNIMEM_REQUIRE_IMAGE_OCR_INTEGRATION: "1"
        run: |
          pytest \
            tests/integration/ocr/test_real_image_ocr.py \
            tests/unit/ocr/test_tesseract_image_adapter.py \
            tests/unit/ocr/test_engine_runner.py \
            tests/unit/api/test_image_ocr_composition.py \
            tests/unit/processing/test_image_ocr_port.py \
            tests/unit/processing/test_image_ocr_processor.py \
            tests/integration/api/test_image_ocr_capture.py \
            -rs --junitxml=image-ocr.xml

      - name: Prove the native image tests actually ran
        # Belt and braces, exactly as for the PDF job. The required mode turns
        # every in-test skip into a failure, so this can only fire if a class is
        # renamed, deselected, or skipped by something outside that policy — each
        # of which would leave a passing job that never touched the engine.
        if: always()
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          #: The classes that must run, and the number of tests each must contribute.
          #: Only the ones that genuinely exercise the real engine are listed: the
          #: rest of the command above is ordinary coverage that happens to be worth
          #: running here too.
          REQUIRED = {
              "tests.integration.ocr.test_real_image_ocr.TestTheFixtureIsHonest": 3,
              "tests.integration.ocr.test_real_image_ocr.TestTheEngineReallyReads": 5,
              "tests.integration.ocr.test_real_image_ocr.TestTheProcessorOverTheRealEngine": 4,
              "tests.integration.ocr.test_real_image_ocr.TestOverRealHttp": 2,
          }

          suite = ET.parse("image-ocr.xml").getroot()
          totals = suite.find("testsuite") if suite.tag == "testsuites" else suite
          if totals is None:
              sys.exit("no test suite was recorded")

          ran = int(totals.get("tests", "0"))
          errors = int(totals.get("errors", "0"))
          print(f"tests={ran} errors={errors}")
          if ran == 0:
              sys.exit("the suite did not run at all")
          if errors:
              sys.exit(f"{errors} collection or setup errors were recorded")

          counted = {}
          skipped = []
          for case in totals.iter("testcase"):
              name = case.get("classname") or ""
              if not name.startswith("tests.integration.ocr.test_real_image_ocr."):
                  continue
              counted[name] = counted.get(name, 0) + 1
              if case.find("skipped") is not None:
                  skipped.append(f"{name}::{case.get('name')}")

          native = sum(counted.values())
          print(f"native image OCR tests={native} skipped={len(skipped)}")
          if native == 0:
              sys.exit("no native image OCR test ran; the engine was never exercised")
          if skipped:
              sys.exit("required image OCR tests were skipped: " + ", ".join(skipped))

          for name, floor in REQUIRED.items():
              found = counted.get(name, 0)
              print(f"{name}={found} (required >= {floor})")
              if found < floor:
                  sys.exit(f"{name} contributed {found} tests; at least {floor} were required")
          PY

  local-media:
    # The sixth job, and the only one that installs FFmpeg. The five above run
    # on machines with no media tooling at all and must keep doing so: nothing
    # they exercise needs ffprobe, and that is the property which makes local
    # media probing *optional*. In particular the `Quality gates` job still
    # installs `.[dev]` and nothing else, and the media unit suites run there
    # against doubles, so a green quality gate is evidence that the default
    # build needs no engine.
    #
    # This job is the other half. It proves the thing a double cannot:
    #
    #   a real WAV, MP3, OGG, MP4 and WebM, built on the spot by system ffmpeg
    #     -> real ffprobe reads their containers through the `fd:` input
    #     -> real container aliases, durations, codecs, sample rates, channel
    #        counts, dimensions and exact rational frame rates
    #     -> POST /v1/uploads + POST /v1/captures against a real server process
    #        on a real socket, started with `--media`
    #     -> an AUDIO or VIDEO ContentObject with structural metadata, the
    #        immutable original as its one asset, and no segments at all
    #     -> the process is stopped and restarted over the same data directory
    #        and everything reads back identically
    #
    # ...and the refusals: an MP3 declared as MP4 is a 422 and a durably FAILED
    # capture, while an engine that fails mid-run leaves the capture PROCESSING
    # behind a safe 503.
    #
    # There is deliberately NO Python media extra to install. The adapter is
    # standard library plus `core`, so this job installs `.[dev]` exactly as the
    # quality gates do, and the only thing that makes it different is apt.
    name: Local media probing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install FFmpeg
        # A system prerequisite, installed by the machine's package manager.
        # This project never installs, downloads, or vendors it — which is
        # exactly why it has to be named here. The package provides both
        # `ffprobe`, which production uses, and `ffmpeg`, which only the tests
        # use, to *build* the fixtures: no binary media fixture is committed to
        # this repository and nothing is fetched at test time.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install the package with dev dependencies ONLY
        # Deliberately not ".[dev,media]". There is no such extra, and the
        # absence is part of what this job demonstrates.
        run: python -m pip install -e ".[dev]"

      - name: Print what is actually going to run
        # Through the project's own prerequisite surface rather than a separate
        # shell command, so this log line is evidence about the code path the
        # adapter takes — including the `fd` protocol check, which a bare
        # `ffprobe -version` would not exercise.
        run: |
          ffprobe -version | head -1
          python -c "from unimem_media import describe_prerequisites; print(describe_prerequisites())"

      - name: Real media probing, with skips forbidden
        env:
          # Without this the native tests skip when ffprobe or ffmpeg is
          # missing, and a green run would prove nothing. With it, every one of
          # those reasons is a failure instead. The OCR required flags are
          # deliberately NOT set: those suites need tooling this job does not
          # install, and they skip here on purpose.
          UNIMEM_REQUIRE_MEDIA_INTEGRATION: "1"
        # `unimem_media` is measured alongside the two packages the quality-gates
        # job measures: the adapter is where the subprocess, the temporary files
        # and the resource bounds live, and an unmeasured adapter is where an
        # untested error path hides.
        #
        # The whole suite rather than a media-only selection, exactly as the
        # `Local PDF OCR` job runs it: the coverage floor is defined over the
        # baseline packages, so measuring a subset against it would either fail
        # honestly or have to be exempted dishonestly. The OCR native suites skip
        # here, on purpose — this job installs no Tesseract and no rasterizer,
        # and their required flags are deliberately unset.
        run: |
          pytest \
            --cov=core --cov=unimem_api --cov=unimem_media \
            -rs --junitxml=local-media.xml

      - name: Prove the native media tests actually ran
        # Belt and braces, exactly as for the two OCR jobs. The required mode
        # turns every in-test skip into a failure, so this can only fire if a
        # class is renamed, deselected, or skipped by something outside that
        # policy — each of which would otherwise leave a passing job that never
        # touched ffprobe.
        #
        # Each acceptance group is counted separately and by its *full* name.
        # Counting by bare class name would let two different modules'
        # identically named classes cover for each other.
        if: always()
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          #: Fully-qualified class -> the number of tests it must contribute, at least.
          REQUIRED = {
              "tests.integration.media.test_real_ffprobe.TestTheFixturesAreReal": 13,
              "tests.integration.media.test_real_ffprobe.TestTheProbeReadsRealContainers": 23,
              "tests.integration.media.test_real_ffprobe.TestTheProbeReadsRealDurations": 12,
              "tests.integration.media.test_real_ffprobe.TestTheProbeReadsRealAudioStreams": 17,
              "tests.integration.media.test_real_ffprobe.TestTheProbeReadsRealVideoStreams": 15,
              "tests.integration.media.test_real_ffprobe.TestStreamsTheProbeIgnores": 3,
              "tests.integration.media.test_real_ffprobe.TestTheRealEngineFailing": 3,
              "tests.integration.media.test_real_ffprobe.TestTheRealEngineIsShareable": 4,
              "tests.integration.media.test_real_ffprobe.TestTheStartupGateOnThisMachine": 4,
              "tests.integration.media.test_real_media_http.TestEveryFamilyOverRealHttp": 48,
              "tests.integration.media.test_real_media_http.TestTheRealStreamFactsReachCanonicalContent": 7,
              "tests.integration.media.test_real_media_http.TestADeclarationTheBytesContradict": 5,
              "tests.integration.media.test_real_media_http.TestTheDefaultDeploymentStillRefusesMedia": 2,
              "tests.integration.media.test_real_media_http.TestARestartOfTheServerProcess": 3,
              "tests.integration.media.test_real_media_http.TestARuntimeProbeFailureOverHttp": 7,
              "tests.integration.media.test_real_media_http.TestStartupRefusalIsNotASkip": 2,
          }

          #: Everything under this prefix is the required native suite.
          NATIVE_PREFIX = "tests.integration.media."

          suite = ET.parse("local-media.xml").getroot()
          totals = suite.find("testsuite") if suite.tag == "testsuites" else suite
          if totals is None:
              sys.exit("no test suite was recorded")

          ran = int(totals.get("tests", "0"))
          errors = int(totals.get("errors", "0"))
          print(f"tests={ran} errors={errors}")
          if ran == 0:
              sys.exit("the suite did not run at all")
          if errors:
              # A missing prerequisite under the required mode surfaces as a
              # collection error rather than a skip, so this is not a formality.
              sys.exit(f"{errors} collection or setup errors were recorded")

          counted = {}
          skipped = []
          for case in totals.iter("testcase"):
              name = case.get("classname") or ""
              if not name.startswith(NATIVE_PREFIX):
                  continue
              counted[name] = counted.get(name, 0) + 1
              if case.find("skipped") is not None:
                  skipped.append(f"{name}::{case.get('name')}")

          native = sum(counted.values())
          print(f"native media tests={native} skipped={len(skipped)}")
          if native == 0:
              sys.exit("no native media test ran; ffprobe was never exercised")
          if skipped:
              sys.exit("required media tests were skipped: " + ", ".join(skipped))

          for name, floor in REQUIRED.items():
              found = counted.get(name, 0)
              print(f"{name}={found} (required >= {floor})")
              if found < floor:
                  sys.exit(f"{name} contributed {found} tests; at least {floor} were required")
          PY
