name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy

      - name: pytest
        # Both packages, so the delivery surface is measured too and the
        # coverage floor applies to it rather than only to the kernel.
        run: pytest --cov=core --cov=unimem_api

  browser-connector:
    name: Browser connector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The connector has no dependencies at all — no bundler, no test
      # framework, nothing to install — so this step exists only to pin the
      # runtime that `node --test` comes from.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: node --test
        run: npm test --prefix clients/browser-extension
