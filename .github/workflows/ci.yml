name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy

      - name: pytest
        # Both packages, so the delivery surface is measured too and the
        # coverage floor applies to it rather than only to the kernel.
        run: pytest --cov=core --cov=unimem_api

  browser-connector:
    name: Browser connector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The connector has no dependencies at all — no bundler, no test
      # framework, nothing to install — so this step exists only to pin the
      # runtime that `node --test` comes from.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: node --test
        run: npm test --prefix clients/browser-extension

  browser-api-integration:
    # The two jobs above each prove one side. This one proves they meet, for
    # both things the extension can capture.
    #
    #   selection, and a lost response:
    #     real connector JS
    #       -> first POST reaches real uvicorn on a real socket
    #       -> that response is thrown away after the server processed it
    #       -> the same envelope, same id, is POSTed once more
    #       -> the server answers 200 replay
    #       -> the connector reports complete, confirmed by replay
    #       -> one CaptureRecord, one ContentObject, one raw original
    #
    #   whole page:
    #     real connector whole-page flow, builder, and client
    #       -> a representative outerHTML snapshot (the only fake: there is no
    #          browser here, so the page read is stubbed)
    #       -> POST reaches the same real server
    #       -> 201, OK, a durable web ContentObject whose original is the exact
    #          submitted bytes
    #     ...and the same flow with the first reply lost:
    #       -> retry is answered 409, because webpage replay is intentionally
    #          absent
    #       -> one observational GET sees COMPLETE
    #       -> confirmed success, two POSTs and one GET, one of everything
    #
    # It needs both runtimes, which is why it is its own job rather than a step
    # in either of the others: the Python job must not grow a Node dependency,
    # and the connector job must not grow a Python one.
    name: Browser/API cross-language integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Cross-language acceptance tests
        env:
          # Without this the tests skip when node is missing or the connector's
          # port is taken, and a green run would prove nothing. With it, every
          # such reason is a failure instead — for the whole-page classes as
          # much as for the selection one.
          UNIMEM_REQUIRE_CONNECTOR_INTEGRATION: "1"
        run: |
          pytest \
            "tests/integration/api/test_completed_capture_replay.py::TestThroughTheConnectorItself" \
            "tests/integration/api/test_browser_whole_page_capture.py::TestWholePageThroughTheConnector" \
            "tests/integration/api/test_browser_whole_page_capture.py::TestTheWholePageLostResponse" \
            -v -rs --junitxml=connector-integration.xml

      - name: Prove they actually ran
        # Belt and braces. The required mode turns every in-test skip into a
        # failure, so this can only fire if a class is renamed, deselected, or
        # skipped by something outside that policy — each of which would
        # otherwise leave a passing job that tested nothing at all.
        #
        # Each class is counted separately, and the selection guarantee keeps its
        # own floor: adding whole-page coverage must not be a way to quietly ship
        # fewer selection assertions.
        if: always()
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          #: class name -> the number of tests it must contribute, at least.
          REQUIRED = {
              "TestThroughTheConnectorItself": 8,
              "TestWholePageThroughTheConnector": 1,
              "TestTheWholePageLostResponse": 1,
          }

          suite = ET.parse("connector-integration.xml").getroot()
          totals = suite.find("testsuite") if suite.tag == "testsuites" else suite
          if totals is None:
              sys.exit("no test suite was recorded")

          ran = int(totals.get("tests", "0"))
          skipped = int(totals.get("skipped", "0"))
          print(f"tests={ran} skipped={skipped}")

          if ran == 0:
              sys.exit("the cross-language acceptance tests did not run at all")
          if skipped:
              sys.exit(f"{skipped} of {ran} cross-language acceptance tests were skipped")

          counted = {}
          for case in totals.iter("testcase"):
              name = (case.get("classname") or "").rsplit(".", 1)[-1]
              counted[name] = counted.get(name, 0) + 1

          for name, floor in REQUIRED.items():
              found = counted.get(name, 0)
              print(f"{name}={found} (required >= {floor})")
              if found < floor:
                  sys.exit(f"{name} contributed {found} tests; at least {floor} were required")
          PY

  pdf-ocr:
    # The three jobs above run on an ordinary installation and must keep doing
    # so: nothing they exercise needs a rasterizer, an imaging library, or an OCR
    # engine, and that is the property that makes local OCR *optional*. This job
    # is the other half — the only one that installs the `ocr` extra and a system
    # Tesseract, and the only one where the native recognition tests are allowed
    # to run at all.
    #
    # It proves the thing a fake engine cannot:
    #
    #   an image-only PDF with no text layer
    #     -> real PDFium rasterizes the page at 300 DPI
    #     -> real Tesseract reads it, in English and in Russian
    #     -> POST /v1/uploads + POST /v1/captures against a real server process
    #        on a real socket
    #     -> a DOCUMENT ContentObject whose segments are `ocr` with `ocr`
    #        provenance and the right physical page numbers
    #     -> the process is stopped and restarted over the same data directory
    #        and everything reads back identically
    #
    # ...and the refusals: a blank scan does not become an empty COMPLETE
    # document, and an engine that fails mid-run leaves the capture non-terminal
    # behind a safe 503.
    name: Local PDF OCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Tesseract with English and Russian language data
        # System prerequisites, installed by the machine's package manager. This
        # project never installs, downloads, or vendors any of them — which is
        # exactly why they have to be named here. `fonts-dejavu-core` is for the
        # *tests*: the image-only fixtures are rendered locally from a system
        # font, because no font file and no binary fixture is committed to this
        # repository and nothing is fetched at test time.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus fonts-dejavu-core

      - name: Install package with dev and ocr extras
        run: python -m pip install -e ".[dev,ocr]"

      - name: Print what is actually going to run
        # Through the project's own probes rather than a separate shell command,
        # so this log line is evidence about the code path the adapter takes.
        run: |
          tesseract --version
          tesseract --list-langs
          python -c "from unimem_ocr import describe_prerequisites; print(describe_prerequisites())"

      - name: Whole suite, with the native OCR tests required
        env:
          # Without this the native tests skip when the engine, a language pack,
          # a font, or the extra is missing, and a green run would prove nothing.
          # With it, every one of those reasons is a failure instead.
          UNIMEM_REQUIRE_PDF_OCR_INTEGRATION: "1"
        # `unimem_ocr` is measured alongside the two packages the quality-gates
        # job measures: the adapter is where the subprocess, the native handles,
        # and the resource limits live, and an unmeasured adapter is where an
        # untested error path hides.
        run: |
          pytest \
            --cov=core --cov=unimem_api --cov=unimem_ocr \
            -rs --junitxml=pdf-ocr.xml

      - name: Prove the native tests actually ran
        # Belt and braces, exactly as for the browser/API job. The required mode
        # turns every in-test skip into a failure, so this can only fire if a
        # class is renamed, deselected, or skipped by something outside that
        # policy — each of which would otherwise leave a passing job that never
        # touched the engine.
        #
        # Each acceptance group is counted separately and by its *full* name.
        # Counting by bare class name would let two different modules' identically
        # named classes cover for each other.
        if: always()
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          #: Fully-qualified class -> the number of tests it must contribute, at least.
          REQUIRED = {
              "tests.integration.ocr.test_real_pdf_ocr.TestTheFixturesCarryNoTextLayer": 6,
              "tests.integration.ocr.test_real_pdf_ocr.TestTheEngineReallyReads": 5,
              "tests.integration.ocr.test_real_pdf_ocr.TestTheProcessorOverTheRealEngine": 10,
              "tests.integration.ocr.test_real_pdf_ocr.TestDocumentsTheRealStackRefuses": 6,
              "tests.integration.ocr.test_real_pdf_ocr_http.TestAScanOverRealHttp": 14,
              "tests.integration.ocr.test_real_pdf_ocr_http.TestARestartOfTheServerProcess": 5,
              "tests.integration.ocr.test_real_pdf_ocr_http.TestARuntimeEngineFailureOverHttp": 6,
              "tests.integration.ocr.test_real_pdf_ocr_http.TestStartupRefusalIsNotASkip": 1,
              "tests.unit.ocr.test_tesseract_adapter.TestTheCommandLine": 6,
              "tests.unit.ocr.test_tesseract_adapter.TestResourceLimits": 7,
              "tests.unit.ocr.test_tesseract_adapter.TestTheRecognitionBudget": 6,
              "tests.unit.ocr.test_tesseract_adapter.TestABudgetSpentWaitingForTheNativeLock": 3,
              "tests.unit.ocr.test_tesseract_adapter.TestATimingOutEngine": 3,
              "tests.unit.ocr.test_tesseract_adapter.TestTheNativeLibraryLock": 6,
              "tests.unit.ocr.test_tesseract_adapter.TestRasterLifetime": 10,
              "tests.unit.ocr.test_tesseract_adapter.TestLoadErrorClassification": 46,
              "tests.unit.ocr.test_prerequisites.TestBothLanguagesAreRequired": 9,
              "tests.unit.ocr.test_prerequisites_native.TestPillowMustBeProvenNotAssumed": 4,
              "tests.unit.ocr.test_prerequisites_native.TestTheProductionEntryPointRefusesToStart": 2,
              "tests.integration.ocr.test_pdf_ocr_load_failures.TestAnUnprovenLoadFailureIsNonTerminal": 18,
              "tests.integration.ocr.test_pdf_ocr_load_failures.TestARecognizedFormatFailureStaysAnInputVerdict": 7,
          }

          #: Everything under these prefixes is the required suite.
          OCR_PREFIXES = ("tests.unit.ocr.", "tests.integration.ocr.")

          suite = ET.parse("pdf-ocr.xml").getroot()
          totals = suite.find("testsuite") if suite.tag == "testsuites" else suite
          if totals is None:
              sys.exit("no test suite was recorded")

          ran = int(totals.get("tests", "0"))
          errors = int(totals.get("errors", "0"))
          print(f"tests={ran} errors={errors}")
          if ran == 0:
              sys.exit("the suite did not run at all")
          if errors:
              sys.exit(f"{errors} collection or setup errors were recorded")

          counted = {}
          skipped = []
          for case in totals.iter("testcase"):
              name = case.get("classname") or ""
              if not name.startswith(OCR_PREFIXES):
                  continue
              counted[name] = counted.get(name, 0) + 1
              if case.find("skipped") is not None:
                  skipped.append(f"{name}::{case.get('name')}")

          native = sum(counted.values())
          print(f"native OCR tests={native} skipped={len(skipped)}")
          if native == 0:
              sys.exit("no native PDF OCR test ran; the engine was never exercised")
          if skipped:
              sys.exit("required PDF OCR tests were skipped: " + ", ".join(skipped))

          for name, floor in REQUIRED.items():
              found = counted.get(name, 0)
              print(f"{name}={found} (required >= {floor})")
              if found < floor:
                  sys.exit(f"{name} contributed {found} tests; at least {floor} were required")
          PY
